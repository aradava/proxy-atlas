name: گردآوری پروکسی‌ها · هر ۹۰ دقیقه
run-name: ${{ inputs.automation && 'گردآوری پروکسی‌ها · Cloudflare' || 'به‌روزرسانی فهرست پروکسی‌ها' }}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: سقف اختیاری خروجی (۰ یعنی همه)
        type: number
        default: 0
      publish:
        description: ثبت خروجی در شاخهٔ اصلی مخزن
        type: boolean
        default: true
      automation:
        description: فراخوانی از زمان‌بند Cloudflare
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-proxy-lists
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    name: گردآوری و دسته‌بندی پروکسی‌ها
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: دریافت فیدها و ساخت فهرست
        env:
          PROXY_LIMIT: ${{ fromJSON(format('{0}', inputs.limit || 0)) }}
        run: python3 prox.py --output "$RUNNER_TEMP/prox-results" --limit "$PROXY_LIMIT"

      - name: خلاصهٔ گردآوری
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "prox-results/manifest.json").read_text())
          print("## فهرست پروکسی‌های گردآوری‌شده")
          print(f"- ترکیب‌های یکتای آدرس، پورت و پروتکل در منابع: {data['discovered_candidates']:,}")
          print(f"- آدرس‌های پروکسی در خروجی: {data['collected_proxies']:,}")
          print(f"- آدرس و پورت متمایز در خروجی: {data['distinct_endpoints']:,}")
          print(f"- فیدهای خوانده‌شده: {sum(not s['error'] for s in data['sources']):,}")
          print(f"- خطاهای دریافت فید: {sum(bool(s['error']) for s in data['sources']):,}")
          print(f"- گروه‌های جغرافیایی: {len(data['countries']):,}")
          PY

      - name: ذخیرهٔ فهرست قابل دانلود
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: proxy-results
          path: ${{ runner.temp }}/prox-results/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    name: ثبت فهرست در مخزن
    needs: collect
    if: github.ref_name == github.event.repository.default_branch && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proxy-results
          path: ${{ runner.temp }}/prox-results

      - name: ثبت و ارسال فهرست
        env:
          RESULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          incoming = Path(os.environ["RUNNER_TEMP"]) / "prox-results"
          manifest = json.loads((incoming / "manifest.json").read_text())
          if manifest["collection_mode"] != "grabber" or not (incoming / "all.txt").stat().st_size:
              raise SystemExit("Invalid or empty grabber output")

          published = Path("results/manifest.json")
          if published.is_file():
              previous = json.loads(published.read_text())
              if datetime.fromisoformat(manifest["started_at_utc"]) <= datetime.fromisoformat(previous["started_at_utc"]):
                  (incoming / ".skip-publication").touch()
          PY
          if [[ -f "$RUNNER_TEMP/prox-results/.skip-publication" ]]; then
            echo 'فهرست تازه‌تری در مخزن وجود دارد.'
            exit 0
          fi
          rsync -a --delete "$RUNNER_TEMP/prox-results/" results/
          git add -- results
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update collected proxy lists'
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
