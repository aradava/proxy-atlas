name: گردآوری و تست پروکسی‌ها · هر ۹۰ دقیقه
run-name: ${{ inputs.automation && 'گردآوری و تست · Cloudflare' || 'به‌روزرسانی فهرست پروکسی‌ها' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proxies.yml
      - sources.json
  workflow_dispatch:
    inputs:
      limit:
        description: سقف نمونهٔ آزمایشی (۰ یعنی تست همه)
        type: number
        default: 0
      publish:
        description: ثبت خروجی در شاخهٔ اصلی مخزن
        type: boolean
        default: true
      automation:
        description: فراخوانی از زمان‌بند Cloudflare
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-proxy-lists
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    name: گردآوری نامزدها از همهٔ فیدها
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: |
            /prox.py
            /proxy_sources.py
            /sources.json
            /check_pipeline.py
          sparse-checkout-cone-mode: false

      - name: دریافت فیدها و تقسیم نامزدها
        id: plan
        env:
          PROXY_LIMIT: ${{ fromJSON(format('{0}', inputs.limit || 0)) }}
        run: python3 check_pipeline.py prepare "$RUNNER_TEMP/prox-plan" --limit "$PROXY_LIMIT" --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: proxy-plan
          path: ${{ runner.temp }}/prox-plan/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  build:
    name: ساخت موتور رسمی ProxyScrape
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: |
            /checker/proxyscrape.go
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ProxyScrape/proxyscrape-proxy-checker
          ref: f0fb0fad29c989b012626de67a3b83abc722f4c6
          path: upstream
          persist-credentials: false
          sparse-checkout: backend

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.2'
          cache: false

      - name: ساخت فایل اجرایی لینوکس
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p upstream/backend/cmd/atlas-check "$RUNNER_TEMP/engine"
          cp checker/proxyscrape.go upstream/backend/cmd/atlas-check/main.go
          cd upstream/backend
          go build -tags webserver -mod=vendor -o "$RUNNER_TEMP/engine/atlas-check" ./cmd/atlas-check

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: proxy-engine
          path: ${{ runner.temp }}/engine/atlas-check
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  check:
    name: تست بستهٔ ${{ matrix.batch }}
    needs: [collect, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.collect.outputs.batches) }}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: proxy-plan
          path: ${{ runner.temp }}/prox-plan

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: proxy-engine
          path: ${{ runner.temp }}/engine

      - name: تست اتصال با ۵۰۰ کار هم‌زمان
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/prox-report"
          mkdir -p "$output"
          chmod +x "$RUNNER_TEMP/engine/atlas-check"
          "$RUNNER_TEMP/engine/atlas-check" -input "$RUNNER_TEMP/prox-plan/batch-$BATCH.txt" \
            -output "$output/working-$BATCH.txt" -threads 500 -timeout-ms 6000 \
            | tee "$output/stats-$BATCH.json"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: proxy-check-${{ matrix.batch }}
          path: ${{ runner.temp }}/prox-report/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  merge:
    name: ساخت فهرست پروکسی‌های تأییدشده
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: |
            /prox.py
            /proxy_sources.py
            /check_pipeline.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: proxy-plan
          path: ${{ runner.temp }}/prox-plan

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: proxy-check-*
          merge-multiple: true
          path: ${{ runner.temp }}/prox-reports

      - name: اعتبارسنجی بسته‌ها و ادغام سالم‌ها
        run: |
          python3 check_pipeline.py merge "$RUNNER_TEMP/prox-plan" "$RUNNER_TEMP/prox-reports" "$RUNNER_TEMP/prox-results"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: proxy-results
          path: ${{ runner.temp }}/prox-results/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    name: ثبت فهرست در مخزن
    needs: merge
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || (inputs.publish && inputs.limit == 0))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proxy-results
          path: ${{ runner.temp }}/prox-results

      - name: ثبت و ارسال فهرست
        env:
          RESULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          incoming = Path(os.environ["RUNNER_TEMP"]) / "prox-results"
          manifest = json.loads((incoming / "manifest.json").read_text())
          if (
              manifest["collection_mode"] != "verified"
              or manifest["tested_candidates"] != manifest["discovered_candidates"]
              or not (incoming / "all.txt").stat().st_size
          ):
              raise SystemExit("Invalid or empty verified output")

          published = Path("results/manifest.json")
          if published.is_file():
              previous = json.loads(published.read_text())
              if datetime.fromisoformat(manifest["started_at_utc"]) <= datetime.fromisoformat(previous["started_at_utc"]):
                  (incoming / ".skip-publication").touch()
          PY
          if [[ -f "$RUNNER_TEMP/prox-results/.skip-publication" ]]; then
            echo 'فهرست تازه‌تری در مخزن وجود دارد.'
            exit 0
          fi
          rsync -a --delete "$RUNNER_TEMP/prox-results/" results/
          git add -- results
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified proxy lists'
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
