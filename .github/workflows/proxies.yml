name: به‌روزرسانی پروکسی‌ها
run-name: ${{ inputs.automation && 'تست کامل · Cloudflare' || 'به‌روزرسانی پروکسی‌ها' }}

on:
  schedule:
    - cron: '6 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: سقف اختیاری برای تست کوتاه (۰ یعنی همه)
        type: number
        default: 0
      publish:
        description: ثبت خروجی در شاخهٔ اصلی مخزن
        type: boolean
        default: true
      automation:
        description: فراخوانی از زمان‌بند Cloudflare
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-proxy-lists
  queue: max
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/proxy-pipeline.yml
    permissions:
      contents: write
    with:
      scan: full
      limit: ${{ fromJSON(format('{0}', inputs.limit || 0)) }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
