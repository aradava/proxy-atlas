name: آزمایش موتور ProxyScrape
run-name: آزمایش ۱۵ هزار پروکسی روی سه رانر

on:
  push:
    branches:
      - codex/proxyscrape-linux-pilot
    paths:
      - .github/workflows/proxyscrape-pilot.yml
      - pilot/proxyscrape.go

permissions:
  contents: read

jobs:
  prepare:
    name: ساخت موتور و تقسیم ۱۵ هزار آدرس
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: |
            /pilot/proxyscrape.go
            /results/all.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.2'
          cache: false

      - name: ساخت موتور رسمی و انتخاب نمونه
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pilot-input"
          git init --quiet "$RUNNER_TEMP/proxyscrape"
          git -C "$RUNNER_TEMP/proxyscrape" fetch --quiet --depth=1 \
            https://github.com/ProxyScrape/proxyscrape-proxy-checker.git \
            f0fb0fad29c989b012626de67a3b83abc722f4c6
          git -C "$RUNNER_TEMP/proxyscrape" checkout --quiet --detach FETCH_HEAD
          backend="$RUNNER_TEMP/proxyscrape/backend"
          mkdir -p "$backend/cmd/atlas-pilot"
          cp pilot/proxyscrape.go "$backend/cmd/atlas-pilot/main.go"
          (
            cd "$backend"
            go build -tags webserver -mod=vendor -o "$RUNNER_TEMP/pilot-input/atlas-pilot" ./cmd/atlas-pilot
          )
          python3 - <<'PY'
          import ipaddress
          import os
          import random
          import re
          from pathlib import Path

          target = Path(os.environ["RUNNER_TEMP"]) / "pilot-input"
          pattern = re.compile(r"(?:http|https|socks4|socks5)://((?:\d{1,3}\.){3}\d{1,3}):([1-9]\d{0,4})")
          candidates = set()
          with Path("results/all.txt").open() as source:
              for line in source:
                  line = line.strip()
                  match = pattern.fullmatch(line)
                  if match and int(match[2]) <= 65535 and ipaddress.IPv4Address(match[1]).is_global:
                      candidates.add(line)
          sample = random.Random(5000).sample(sorted(candidates), 15_000)
          for part in range(3):
              rows = sample[part * 5000:(part + 1) * 5000]
              (target / f"batch-{part + 1}.txt").write_text("\n".join(rows) + "\n")
          PY

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pilot-input
          path: ${{ runner.temp }}/pilot-input/
          if-no-files-found: error
          retention-days: 3

  check:
    name: تست بستهٔ ${{ matrix.batch }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [1, 2, 3]
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: pilot-input
          path: ${{ runner.temp }}/pilot-input

      - name: بررسی ۵٬۰۰۰ پروکسی با ۵۰۰ اتصال هم‌زمان
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pilot-input"
          output="$RUNNER_TEMP/pilot-output"
          mkdir -p "$output"
          chmod +x "$input/atlas-pilot"
          "$input/atlas-pilot" -input "$input/batch-$BATCH.txt" \
            -output "$output/working-$BATCH.txt" -threads 500 -timeout-ms 6000 \
            | tee "$output/stats-$BATCH.json"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pilot-output-${{ matrix.batch }}
          path: ${{ runner.temp }}/pilot-output/
          if-no-files-found: error
          retention-days: 7

  merge:
    name: ادغام سالم‌ها و گزارش آزمایش
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: pilot-output-*
          merge-multiple: true
          path: ${{ runner.temp }}/pilot-batches

      - name: ثبت نتیجه و زمان هر بسته
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          batches = root / "pilot-batches"
          output = root / "pilot-results"
          output.mkdir()
          rows = []
          working = set()
          for part in (1, 2, 3):
              stats = json.loads((batches / f"stats-{part}.json").read_text())
              found = (batches / f"working-{part}.txt").read_text().splitlines()
              if stats["checked"] != 5000 or len(found) != stats["exported"]:
                  raise ValueError(f"Incomplete batch {part}")
              rows.append({"batch": part, **stats})
              working.update(found)

          report = {"checked": 15_000, "working": len(working), "batches": rows}
          (output / "report.json").write_text(json.dumps(report, indent=2) + "\n")
          (output / "working.txt").write_text("".join(f"{item}\n" for item in sorted(working)))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              print(f"**{len(working):,} پروکسی سالم از ۱۵٬۰۰۰ آدرس**\n", file=summary)
              for row in rows:
                  print(f"- بستهٔ {row['batch']} — {row['seconds']:.1f} ثانیه و {row['exported']} سالم", file=summary)
          print("::notice title=ProxyScrape pilot result::" + json.dumps(report, separators=(",", ":")))
          PY

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: proxyscrape-pilot-results
          path: ${{ runner.temp }}/pilot-results/
          if-no-files-found: error
          retention-days: 7
