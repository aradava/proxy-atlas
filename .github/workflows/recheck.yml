name: بازتست پروکسی‌های سالم
run-name: ${{ inputs.automation && 'بازتست سالم‌ها · Cloudflare' || 'بازتست پروکسی‌های سالم' }}

on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: ثبت خروجی در شاخهٔ اصلی مخزن
        type: boolean
        default: true
      automation:
        description: فراخوانی از زمان‌بند Cloudflare
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-proxy-lists
  queue: max
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/proxy-pipeline.yml
    permissions:
      contents: write
    with:
      scan: recheck
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      skip_fresh: ${{ github.event_name == 'schedule' || inputs.automation }}
